name: Build & Lint

on:
  push:
    branches: [main, develop, cms-phase1, phase1-fixes]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://madaalinsan.com
          # Prisma غير مستخدم حالياً — بيئة وهمية آمنة
          DATABASE_URL: "file:./dev.db"
